<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#234f3b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Site &amp; Yurt Tracker</title>
<style>
  :root{--bg:#f5f3ec;--ink:#1b2a23;--muted:#c8ddd0;--pine:#2f6b4f;--pine-dark:#234f3b;--done:#2f8f5b;
    --tile:#ffffff;--line:#d6d3c6;--danger:#a23b2e;--shadow:0 1px 2px rgba(20,40,30,.08);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}

  header{background:var(--pine-dark);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;
    position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(20,40,30,.18);}
  .titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  h1{font-size:19px;margin:0;font-weight:700}
  .date{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
  .subtitle{font-size:13px;color:#cfe3d7;font-weight:600;margin-top:3px}
  .tabs{display:flex;gap:6px;margin-top:12px}
  .tab{flex:1;border:0;background:transparent;color:#bcd4c7;font-size:15px;font-weight:700;
    padding:11px 8px 12px;border-bottom:3px solid transparent;cursor:pointer;}
  .tab .n{font-size:12px;font-weight:700;opacity:.9;margin-left:6px}
  .tab.active{color:#fff;border-bottom-color:#7ed3a2}

  main{padding:14px 16px calc(120px + env(safe-area-inset-bottom))}
  .hostbadge{display:inline-block;background:#3a6650;color:#fff;padding:4px 8px;border-radius:7px;font-size:13px;margin-right:7px}
  .assignment{background:#fff;border:1px solid #d6ded5;border-radius:14px;padding:16px;margin-bottom:16px}
  .assignment .eyebrow{font-size:12px;color:#526a59;letter-spacing:.5px}
  .assignment h2{font-size:25px;margin:5px 0;color:var(--pine-dark)}
  .workdate{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;font-size:14px}
  .workdate input{font:inherit;min-height:44px;max-width:100%;border:1px solid #bbc9bd;border-radius:8px;padding:8px;background:#fff;color:var(--ink)}
  .task{display:flex;align-items:center;gap:12px;padding:14px;min-height:60px;margin-bottom:9px;background:#fff;border:1px solid #d6ded5;border-radius:12px;font-weight:600;cursor:pointer}
  .task input{width:24px;height:24px;flex-shrink:0;accent-color:var(--done)}
  .task.complete{background:#e6f0e6}
  .task.complete span{text-decoration:line-through}
  .tasksummary{color:#526a59;font-size:14px;margin:0 0 12px}
  .storage-warning{background:#fff0de;color:#702e17;padding:12px;position:sticky;top:0;z-index:40}
  .toprow{display:flex;align-items:center;justify-content:flex-end;margin-bottom:10px}
  .linkbtn{background:transparent;border:0;color:var(--pine);font-size:14px;font-weight:800;cursor:pointer;padding:4px}

  .timer{text-align:center;font-variant-numeric:tabular-nums;font-size:17px;font-weight:800;color:var(--pine-dark);
    background:#eaf6ef;border:1px solid #cfe9d9;border-radius:12px;padding:11px;margin-bottom:14px}
  .timer small{display:block;font-size:11px;font-weight:700;color:#6b7268;letter-spacing:.4px;text-transform:uppercase;margin-bottom:2px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}
  .loop-tabs{display:flex;gap:8px;margin-bottom:14px}
  .loop-tab{flex:1;min-height:48px;border:1px solid #bbc9bd;border-radius:10px;background:#fff;color:var(--pine-dark);font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:10px 4px}
  .loop-tab[aria-pressed="true"]{background:var(--pine-dark);border-color:var(--pine-dark);color:#fff}
  .yurt-grid{display:flex;flex-direction:column;gap:10px}
  .yurt-row{display:flex;justify-content:center;gap:10px;min-height:70px}
  .yurt-row .cell{flex:0 0 calc((100% - 20px)/3);max-width:110px}
  .yurt-row .empty{visibility:hidden;pointer-events:none}
  .cell{position:relative;min-height:70px;border-radius:14px;border:2px solid var(--line);background:var(--tile);
    color:var(--ink);font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:8px 6px;cursor:pointer;box-shadow:var(--shadow);word-break:break-word;
    transition:transform .06s ease,background .15s ease,border-color .15s ease,color .15s ease;}
  .cell:active{transform:scale(.95)}
  .cell.on{background:var(--done);border-color:var(--done);color:#fff}
  .cell.on .lbl{text-decoration:line-through;text-decoration-thickness:2px}
  .cell .check{position:absolute;top:5px;right:7px;font-size:14px;font-weight:900;opacity:0;transition:opacity .15s ease}
  .cell.on .check{opacity:1}

  .msg{text-align:center;padding:44px 20px;color:#6b7268;font-size:15px;line-height:1.5}

  .logitem{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .logitem .d{font-weight:800;font-size:15px}
  .logitem .t{font-size:13px;color:#6b7268;margin:2px 0 8px;font-weight:600;font-variant-numeric:tabular-nums}
  .logitem .r{font-size:14px;line-height:1.5}
  .logitem .lab{font-weight:800;color:var(--pine)}
  .logitem .skip{color:var(--danger)}

  .btn{border:0;border-radius:12px;font-size:16px;font-weight:800;padding:15px 16px;cursor:pointer}
  .btn.primary{background:var(--pine);color:#fff;box-shadow:var(--shadow)}
  .btn.primary[disabled]{background:#b9c4bd;box-shadow:none;cursor:default}
  .btn.ghost{background:#fff;color:var(--pine);border:2px solid var(--line)}

  .footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:30;box-shadow:0 -2px 10px rgba(20,40,30,.06)}
  .footer .btn{flex:1}
  .footer .btn.side{flex:0 0 auto;padding-left:20px;padding-right:20px}

  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<header>
  <div class="titlerow"><h1>Site &amp; Yurt Tracker</h1><span class="hostbadge">B6</span></div>
  <div class="date" id="date"></div>
  <div class="subtitle" id="subtitle"></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="tasks">Tasks<span class="n" id="n-tasks"></span></button>
    <button class="tab active" data-tab="sites">Sites<span class="n" id="n-sites"></span></button>
    <button class="tab" data-tab="yurts">Yurts<span class="n" id="n-yurts"></span></button>
  </div>
</header>

<div id="storage-warning" class="storage-warning" role="alert" hidden>Changes could not be saved on this phone. Keep the app open and copy your history before closing.</div>
<main id="main"></main>
<div class="footer" id="footer"></div>

<script>
(function(){
  "use strict";
  var KEY="parkTracker.v5";
  function range(first,last){var a=[];for(var i=first;i<=last;i++)a.push(String(i));return a;}
  var LOOPS={A:range(76,91),B:range(1,35).filter(function(n){return ["2","6","3","4","5","8","10","32","34"].indexOf(n)===-1;}),C:range(40,72)};
  var ROSTERS={ sites:LOOPS.B.concat(LOOPS.C,LOOPS.A),
                yurts:["34Y","32Y","3Y","4Y","5Y","8Y","10Y"] };
  var YURT_ROWS=[["34Y","32Y"],["3Y","4Y","5Y"],["8Y","10Y"]];

  var GREETING={role:"Greeting",hours:"2:00 PM – 9:00 PM",tasks:["Firewood & Ventek","Sites / firepits / pads","Blow pathways","Check recycling","PM RR check","Dog bags"]};
  var YURTS={role:"Yurts",hours:"9:00 AM – 2:00 PM",tasks:["Yurt cleaning","Sites / firepits / pads"]};
  var DAY_USE={role:"Day Use",hours:"9:00 AM – 2:00 PM",tasks:["Blow pathways & table pads","PM DU RR check","Dog bags","Litter pick DRT","Sites / firepits / pads"]};
  var OFF={role:"Day off",hours:"No scheduled duties",tasks:[]};
  var WEEK=[DAY_USE,GREETING,GREETING,YURTS,YURTS,OFF,OFF];
  function localDate(ms){var d=new Date(ms);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function dateFromKey(key){return new Date(key+"T12:00:00");}
  function validDate(key){return typeof key==="string" && /^\d{4}-\d{2}-\d{2}$/.test(key) && Number.isFinite(dateFromKey(key).getTime()) && localDate(dateFromKey(key).getTime())===key;}
  var state={ screen:"add", active:"tasks", activeLoop:"C", picked:{sites:[],yurts:[]}, startTime:null, history:[], workDate:localDate(Date.now()), tasks:[] };
  var observedDate=localDate(Date.now());
  function assignment(){return WEEK[dateFromKey(state.workDate).getDay()];}
  function resetTasks(){state.tasks=assignment().tasks.map(function(label){return {label:label,done:false};});}
  function hasProgress(){return state.startTime!==null || totalPicked()>0 || state.tasks.some(function(t){return t.done;});}
  function buzz(){try{navigator.vibrate(35);}catch(e){}}

  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); document.getElementById("storage-warning").hidden=true; return true; }catch(e){document.getElementById("storage-warning").hidden=false;return false;} }
  function load(){
    try{ var d=JSON.parse(localStorage.getItem(KEY)||"null"); if(!d)return;
      state.screen=(d.screen==="track" || d.screen==="history")?d.screen:"add";
      state.active=["tasks","sites","yurts"].indexOf(d.active)!==-1?d.active:"tasks";
      state.activeLoop=["A","B","C"].indexOf(d.activeLoop)!==-1?d.activeLoop:"C";
      ["sites","yurts"].forEach(function(k){
        var list=d.picked && Array.isArray(d.picked[k])?d.picked[k]:[];
        state.picked[k]=ROSTERS[k].filter(function(label){return list.some(function(i){return i && i.label===label;});}).map(function(label){return {label:label,done:!!list.find(function(i){return i && i.label===label;}).done};});
      });
      state.startTime=Number.isFinite(d.startTime) && d.startTime>0?d.startTime:null;
      state.history=Array.isArray(d.history)?d.history:[];
      state.workDate=validDate(d.workDate)?d.workDate:localDate(state.startTime||Date.now());
      resetTasks();
      state.tasks.forEach(function(t){t.done=Array.isArray(d.tasks) && d.tasks.some(function(i){return i && i.label===t.label && i.done;});});
      if(!hasProgress()){state.workDate=localDate(Date.now());resetTasks();}
      if(state.screen==="track" && state.startTime===null)state.screen="add";
    }catch(e){}
  }

  function picks(){ return state.picked[state.active]; }
  function isPicked(l){ return picks().some(function(i){return i.label===l;}); }
  function togglePick(l){
    var list=picks(),p=-1; for(var i=0;i<list.length;i++){if(list[i].label===l){p=i;break;}}
    if(p>-1)list.splice(p,1); else list.push({label:l,done:false});
    save(); render();
  }
  function totalPicked(){ return state.picked.sites.length+state.picked.yurts.length; }

  function pad(n){ return (n<10?"0":"")+n; }
  function elapsed(ms){ var s=Math.floor(Math.max(0,ms)/1000),h=Math.floor(s/3600);s%=3600;var m=Math.floor(s/60),ss=s%60;
    return h>0?(h+":"+pad(m)+":"+pad(ss)):(m+":"+pad(ss)); }
  function durHMS(ms){ var s=Math.floor(Math.max(0,ms)/1000),h=Math.floor(s/3600);s%=3600;var m=Math.floor(s/60),ss=s%60;
    return h+":"+pad(m)+":"+pad(ss); }
  function clockStr(ms){ try{return new Date(ms).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}catch(e){return"";} }
  function dateStr(ms){ try{return new Date(ms).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});}catch(e){return"";} }
  function today(){ return dateStr(Date.now()); }

  var main=document.getElementById("main"), footer=document.getElementById("footer"), tabs=document.getElementById("tabs");

  function render(){
    document.getElementById("date").textContent=today();

    if(state.screen==="history"){
      document.getElementById("subtitle").textContent="Your shift and cleaning log";
      tabs.style.display="none";
      renderHistory(); return;
    }
    tabs.style.display="flex";
    document.getElementById("subtitle").textContent =
      state.screen==="add" ? "Your B6 schedule and cleaning list" : "Tap each task or tile as you finish";
    document.getElementById("n-tasks").textContent=state.tasks.filter(function(t){return t.done;}).length+"/"+state.tasks.length;

    ["sites","yurts"].forEach(function(k){
      var p=state.picked[k], t="";
      if(state.screen==="add") t=p.length?String(p.length):"";
      else { var d=p.filter(function(i){return i.done;}).length; t=p.length?(d+"/"+p.length):""; }
      document.getElementById("n-"+k).textContent=t;
    });
    Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){
      t.classList.toggle("active",t.getAttribute("data-tab")===state.active);
      t.setAttribute("aria-pressed",t.getAttribute("data-tab")===state.active?"true":"false");
    });

    if(state.screen==="add") renderAdd(); else renderTrack();
  }

  function renderAssignment(){
    var box=document.createElement("section"); box.className="assignment";
    var dateLabel=document.createElement("label"); dateLabel.className="workdate"; dateLabel.textContent="Work date";
    var input=document.createElement("input"); input.type="date";input.value=state.workDate;input.disabled=hasProgress();
    input.addEventListener("change",function(){if(!validDate(input.value)){input.value=state.workDate;return;}state.workDate=input.value;resetTasks();save();render();});
    dateLabel.appendChild(input);box.appendChild(dateLabel);
    var day=document.createElement("div");day.className="eyebrow";day.textContent=dateFromKey(state.workDate).toLocaleDateString(undefined,{weekday:"long"})+" · B6";
    var title=document.createElement("h2");title.textContent=assignment().role;
    var hours=document.createElement("div");hours.textContent=assignment().hours;
    box.appendChild(day);box.appendChild(title);box.appendChild(hours);main.appendChild(box);
  }

  function renderTasks(){
    var summary=document.createElement("p");summary.className="tasksummary";
    summary.textContent=state.tasks.length?state.tasks.filter(function(t){return t.done;}).length+" of "+state.tasks.length+" tasks complete":"No scheduled duties. You can still select sites or yurts for extra cleaning.";
    main.appendChild(summary);
    state.tasks.forEach(function(task){
      var row=document.createElement("label");row.className="task"+(task.done?" complete":"");
      var checkbox=document.createElement("input");checkbox.type="checkbox";checkbox.checked=task.done;
      checkbox.addEventListener("change",function(){task.done=checkbox.checked;if(task.done)buzz();save();render();});
      var label=document.createElement("span");label.textContent=task.label;row.appendChild(checkbox);row.appendChild(label);main.appendChild(row);
    });
  }

  function renderLoops(){
    var nav=document.createElement("div");nav.className="loop-tabs";nav.setAttribute("role","group");nav.setAttribute("aria-label","Campsite loop");
    ["A","B","C"].forEach(function(loop){
      var selected=state.picked.sites.filter(function(item){return LOOPS[loop].indexOf(item.label)!==-1;});
      var count=state.screen==="track"?selected.filter(function(item){return item.done;}).length+"/"+selected.length:String(selected.length);
      var button=document.createElement("button");button.className="loop-tab";button.textContent=loop+" Loop ("+count+")";button.setAttribute("aria-pressed",String(state.activeLoop===loop));
      button.addEventListener("click",function(){state.activeLoop=loop;save();render();});nav.appendChild(button);
    });
    main.appendChild(nav);
  }

  function renderAdd(){
    main.innerHTML="";
    var top=document.createElement("div"); top.className="toprow";
    var hist=document.createElement("button"); hist.className="linkbtn"; hist.textContent="History";
    hist.addEventListener("click",function(){ state.screen="history"; save(); render(); });
    top.appendChild(hist); main.appendChild(top);
    renderAssignment();

    if(state.active==="tasks")renderTasks();
    else{
    if(state.active==="sites")renderLoops();
    var grid=document.createElement("div"); grid.className="grid";
    (state.active==="sites"?LOOPS[state.activeLoop]:ROSTERS.yurts).forEach(function(label){
      var on=isPicked(label);
      var c=document.createElement("button");
      c.className="cell"+(on?" on":""); c.setAttribute("aria-pressed",on?"true":"false");
      c.innerHTML='<span class="check">\u2713</span><span class="lbl"></span>';
      c.querySelector(".lbl").textContent=label;
      c.addEventListener("click",function(){ togglePick(label); });
      grid.appendChild(c);
    });
    arrangeYurts(grid); main.appendChild(grid);
    }

    footer.innerHTML="";
    var n=totalPicked();
    var start=document.createElement("button"); start.className="btn primary";
    start.textContent=state.startTime?"Resume shift":"Start shift"; start.disabled=!state.startTime && state.tasks.length===0 && n===0;
    start.addEventListener("click",function(){
      state.screen="track";
      if(!state.startTime) state.startTime=Date.now();
      save(); render();
    });
    footer.appendChild(start);
  }

  function renderTrack(){
    main.innerHTML="";
    renderAssignment();

    var tm=document.createElement("div"); tm.className="timer";
    tm.innerHTML='<small>Shift time</small><span id="timer">'+(state.startTime?elapsed(Date.now()-state.startTime):"0:00")+'</span>';
    main.appendChild(tm);

    if(state.active==="tasks")renderTasks();
    else{
    var list=picks();
    if(state.active==="sites"){
      renderLoops();
      list=list.filter(function(item){return LOOPS[state.activeLoop].indexOf(item.label)!==-1;});
    }
    if(list.length===0){
      var other=state.active==="yurts"?"Sites":"Yurts";
      var m=document.createElement("div"); m.className="msg";
      m.textContent=state.active==="sites"?"No sites picked in "+state.activeLoop+" Loop. Choose another loop, or tap Back to add sites.":"Nothing picked here. Check the "+other+" tab, or tap Back.";
      main.appendChild(m);
    } else {
      var idx={}; ROSTERS[state.active].forEach(function(l,i){idx[l]=i;});
      var display=list.slice().sort(function(a,b){return idx[a.label]-idx[b.label];});
      var grid=document.createElement("div"); grid.className="grid";
      display.forEach(function(item){
        var c=document.createElement("button");
        c.className="cell"+(item.done?" on":""); c.setAttribute("aria-pressed",item.done?"true":"false");
        c.innerHTML='<span class="check">\u2713</span><span class="lbl"></span>';
        c.querySelector(".lbl").textContent=item.label;
        c.addEventListener("click",function(){
          item.done=!item.done;
          if(item.done)buzz();
          save(); render();
        });
        grid.appendChild(c);
      });
      arrangeYurts(grid); main.appendChild(grid);
    }
    }

    footer.innerHTML="";
    var back=document.createElement("button"); back.className="btn ghost side"; back.textContent="Back";
    back.addEventListener("click",function(){ state.screen="add"; save(); render(); });
    var done=document.createElement("button"); done.className="btn primary"; done.textContent="Finish shift";
    done.addEventListener("click",onDone);
    footer.appendChild(back); footer.appendChild(done);
  }

  function arrangeYurts(grid){
    if(state.active!=="yurts")return;
    var cells={};
    Array.prototype.forEach.call(grid.children,function(c){
      cells[c.querySelector(".lbl").textContent]=c;
    });
    grid.innerHTML=""; grid.className="yurt-grid";
    YURT_ROWS.forEach(function(labels){
      var row=document.createElement("div"); row.className="yurt-row";
      labels.forEach(function(label){
        var c=cells[label];
        if(!c){ c=document.createElement("span"); c.className="cell empty"; c.setAttribute("aria-hidden","true"); }
        row.appendChild(c);
      });
      grid.appendChild(row);
    });
  }

  function onDone(){
    if(!confirm("Finish this shift and save tasks and cleaning to history?")) return;
    var end=Date.now();
    var record={
      start: state.startTime||end, end: end,
      host:"B6", workDate:state.workDate, assignment:assignment().role, hours:assignment().hours,
      tasks:state.tasks.filter(function(t){return t.done;}).map(function(t){return t.label;}),
      tasksSkipped:state.tasks.filter(function(t){return !t.done;}).map(function(t){return t.label;}),
      sites: state.picked.sites.filter(function(i){return i.done;}).map(function(i){return i.label;}),
      sitesSkipped: state.picked.sites.filter(function(i){return !i.done;}).map(function(i){return i.label;}),
      yurts: state.picked.yurts.filter(function(i){return i.done;}).map(function(i){return i.label;}),
      yurtsSkipped: state.picked.yurts.filter(function(i){return !i.done;}).map(function(i){return i.label;})
    };
    var previous=JSON.stringify(state);
    state.history.unshift(record);
    state.picked={sites:[],yurts:[]}; state.startTime=null; state.screen="add"; state.active="tasks";
    state.workDate=localDate(Date.now());resetTasks();
    if(!save()){state=JSON.parse(previous);alert("The shift could not be saved. Your current shift is still open. Please copy your history and free storage before trying again.");}
    render();
  }

  function renderHistory(){
    main.innerHTML="";
    if(state.history.length===0){
      var m=document.createElement("div"); m.className="msg"; m.textContent="No sessions saved yet.";
      main.appendChild(m);
    } else {
      state.history.forEach(function(r){
        var dur=durHMS((r.end||r.start)-(r.start||r.end));
        var el=document.createElement("div"); el.className="logitem";
        var sC=r.sites||[], sS=r.sitesSkipped||[], yC=r.yurts||[], yS=r.yurtsSkipped||[];
        var html='<div class="d">'+dateStr(r.start)+'</div>'
          +'<div class="t">'+clockStr(r.start)+' to '+clockStr(r.end)+' \u2022 '+dur+'</div>'
          +'<div class="r"><span class="lab">Sites cleaned ('+sC.length+'):</span> '+(sC.length?sC.join(", "):"none")+'</div>';
        if(sS.length) html+='<div class="r"><span class="lab skip">Sites skipped ('+sS.length+'):</span> '+sS.join(", ")+'</div>';
        html+='<div class="r"><span class="lab">Yurts cleaned ('+yC.length+'):</span> '+(yC.length?yC.join(", "):"none")+'</div>';
        if(yS.length) html+='<div class="r"><span class="lab skip">Yurts skipped ('+yS.length+'):</span> '+yS.join(", ")+'</div>';
        el.innerHTML=html;
        if(r.assignment){
          var shift=document.createElement("div");shift.className="r";
          shift.textContent=(r.host||"B6")+" · "+r.assignment+" · "+(r.hours||"")+(r.workDate?" · Work date: "+r.workDate:"");
          el.appendChild(shift);
          [["Tasks completed",r.tasks||[],false],["Tasks skipped",r.tasksSkipped||[],true]].forEach(function(group){
            var line=document.createElement("div");line.className="r"+(group[2]?" skip":"");
            line.textContent=group[0]+" ("+group[1].length+"): "+(group[1].length?group[1].join("; "):"none");el.appendChild(line);
          });
        }
        main.appendChild(el);
      });
    }

    footer.innerHTML="";
    var back=document.createElement("button"); back.className="btn ghost side"; back.textContent="Back";
    back.addEventListener("click",function(){ state.screen="add"; save(); render(); });
    var copy=document.createElement("button"); copy.className="btn primary"; copy.textContent="Copy for Sheets";
    copy.disabled=state.history.length===0;
    copy.addEventListener("click",copyLog);
    footer.appendChild(back); footer.appendChild(copy);
  }

  function buildTSV(){
    var rows=["Date\tStart\tEnd\tDuration\tSites cleaned\tSites cleaned #\tSites skipped\tSites skipped #\tYurts cleaned\tYurts cleaned #\tYurts skipped\tYurts skipped #\tHost\tWork date\tAssignment\tScheduled hours\tTasks completed\tTasks completed #\tTasks skipped\tTasks skipped #"];
    state.history.forEach(function(r){
      var sC=r.sites||[],sS=r.sitesSkipped||[],yC=r.yurts||[],yS=r.yurtsSkipped||[];
      rows.push([ dateStr(r.start), clockStr(r.start), clockStr(r.end), durHMS((r.end||r.start)-(r.start||r.end)),
        sC.join(" "), sC.length, sS.join(" "), sS.length, yC.join(" "), yC.length, yS.join(" "), yS.length,
        r.host||"",r.workDate||"",r.assignment||"",r.hours||"",(r.tasks||[]).join("; "),(r.tasks||[]).length,(r.tasksSkipped||[]).join("; "),(r.tasksSkipped||[]).length ].join("\t"));
    });
    return rows.join("\n");
  }
  function copyLog(){
    var tsv=buildTSV();
    function ok(){ alert("Copied. Paste into Google Sheets."); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(tsv).then(ok, function(){ fb(tsv); });
    } else fb(tsv);
  }
  function fb(text){
    var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.top="0"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ if(!document.execCommand("copy"))throw new Error("Copy unavailable"); alert("Copied. Paste into Google Sheets."); }
    catch(e){ ta.style.opacity="1";ta.style.width="90%";ta.style.height="200px";ta.style.zIndex="100";ta.setAttribute("aria-label","History export: select and copy");alert("Couldn't auto-copy. Copy the text from the export box."); return; }
    document.body.removeChild(ta);
  }

  tabs.addEventListener("click",function(e){
    var t=e.target.closest(".tab"); if(!t)return;
    state.active=t.getAttribute("data-tab"); save(); render();
  });

  function refreshDay(){
    var currentDate=localDate(Date.now());
    if(currentDate!==observedDate){observedDate=currentDate;if(!hasProgress()){state.workDate=currentDate;resetTasks();save();}render();}
  }
  document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshDay();});
  window.addEventListener("focus",refreshDay);

  setInterval(function(){
    var el=document.getElementById("timer");
    if(el && state.startTime) el.textContent=elapsed(Date.now()-state.startTime);
    refreshDay();
  },1000);

  resetTasks(); load(); save(); render();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
